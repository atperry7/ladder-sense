# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Build against the 26.3 floor so the compiler can't admit later-patch symbols;
# the released jar accepts all of 26.3.x (see fabric.mod.json "minecraft": "~26.3").
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.3.0
maven_group=com.cadaewen.laddersense

# Dependencies
fabric_api_version=0.160.6+26.3